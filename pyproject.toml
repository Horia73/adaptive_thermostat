[project]
name = "adaptive-thermostat"
version = "2.0.0"
description = "Adaptive Thermostat custom integration for Home Assistant (development tooling only)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = [".git", "tools"]
filterwarnings = ["ignore::DeprecationWarning:pytest_homeassistant_custom_component.*"]

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF", "ASYNC", "BLE"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLW0603",
    "E501", "SIM102", "SIM108", "RUF001", "RUF002", "RUF003", "PLC0415",
    "B905",     # zip() over intentionally ragged / successive pairs
    "RUF007",   # pairwise vs zip: both clear here
    "RUF012",   # Home Assistant's class-level _attr_* convention
    "PLW2901",  # loop variable refresh in the simulator is intentional
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "engine"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = false
explicit_package_bases = true

# Home Assistant 2026.x aliases ``voluptuous`` to its successor ``probatio`` at
# runtime; the integration keeps ``import voluptuous`` so it still loads on
# older Home Assistant versions.  mypy sees the two schema classes as distinct.
[[tool.mypy.overrides]]
module = ["custom_components.adaptive_thermostat.config_flow", "custom_components.adaptive_thermostat"]
disable_error_code = ["arg-type", "index"]
